name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack yarn install --frozen-lockfile --non-interactive
      - run: corepack yarn setup:sqlite
      - run: corepack yarn test
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: corepack yarn build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: yeast-win-production
      cancel-in-progress: false
    env:
      YEAST_DEPLOY_URL: ${{ vars.YEAST_DEPLOY_URL }}
      YEAST_DEPLOY_SECRET: ${{ secrets.YEAST_DEPLOY_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger production deployment
        run: python3 deploy/trigger.py
